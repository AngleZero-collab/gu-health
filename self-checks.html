<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174f40"><title>居家健康自我觀察｜顧健康</title>
<style>
:root{--green:#174f40;--ink:#173d34;--line:#d9e5dc;--bg:#f5f8f4;--danger:#8e211a}
*{box-sizing:border-box}body{font:18px/1.65 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:0 18px 48px}main,header{max-width:900px;margin:auto}header{padding:20px 0}h1{font-size:clamp(1.7rem,4vw,2.4rem)}h2{font-size:1.4rem}p{margin:.5rem 0 1rem}button,a.button{font:inherit;display:inline-flex;justify-content:center;align-items:center;min-height:56px;padding:12px 18px;border-radius:14px;border:2px solid var(--green);background:var(--green);color:white;cursor:pointer;text-decoration:none;font-weight:700;touch-action:manipulation}button.secondary,a.button.secondary{color:var(--green);background:white}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #df994d;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}.card h2{margin:0}.card p{color:#50665d}.card button{width:100%}.warning{border-left:6px solid #b45c20;background:#fff1e5;padding:16px;margin:16px 0}.urgent{background:#fff0ed;border:3px solid var(--danger);padding:20px;border-radius:16px;color:#6e1b16;margin:16px 0}.urgent a{color:inherit;font-weight:bold}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.step{font-weight:bold;color:#256b57}.choices{display:grid;gap:12px}.choice{display:flex;align-items:flex-start;gap:12px;border:2px solid #d9e5dc;border-radius:12px;padding:12px;cursor:pointer}.choice input{width:27px;height:27px;flex:0 0 auto;accent-color:var(--green)}label{display:block;font-weight:700}input[type=number],input[type=text],select{font:inherit;max-width:100%;width:100%;min-height:56px;border:2px solid #a9bdb0;border-radius:10px;padding:8px 12px;margin:8px 0}#draw{width:min(100%,370px);height:auto;aspect-ratio:1;display:block;border:2px solid #aecaba;border-radius:12px;background:white;touch-action:none}#timerDisplay{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums}small{display:block;color:#56695f}.sr-only{position:absolute;left:-10000px}#resultText{white-space:pre-line}#status{font-weight:bold}footer{margin-top:32px;color:#4c6055} [hidden]{display:none!important}@media(min-width:700px){.card{margin:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><a href="./#vision" class="button secondary">← 返回顧健康</a></header>
<main>
<h1>居家健康自我觀察</h1>
<p>八項簡易觀察，逐步操作、記錄結果。這些測驗不能確診、排除疾病，也不能取代專業檢查。可請家人陪同。</p>
<div class="urgent"><strong>突然嘴歪、單側手腳無力、說話困難、視力異常或無法平衡？</strong><p>疑似中風請立即撥打 <a href="tel:119">119</a>，記下最後一次正常的時間。不要等待測驗完成或自行駕車。</p></div>
<section id="catalog" class="grid" aria-label="選擇測驗"></section>
<section id="test" hidden class="panel" aria-live="polite">
<button class="secondary" id="back" type="button">← 返回測驗列表</button>
<p class="step" id="progress"></p><h2 id="testTitle"></h2><p id="intro"></p><div id="safety" class="warning"></div>
<div id="task"></div><div class="actions"><button id="prev" class="secondary" type="button">上一步</button><button id="next" type="button">下一步</button></div>
</section>
<section id="result" hidden class="panel" aria-live="polite"><h2>本次觀察結果</h2><p id="resultText"></p><div id="resultAdvice" class="warning"></div><div class="actions"><button id="save" type="button">儲存到我的紀錄</button><button id="again" class="secondary" type="button">返回列表</button></div><p id="status" role="status"></p></section>
<footer>資料僅於按下儲存後寫入目前瀏覽器的顧健康紀錄。共用裝置請注意個人隱私；清除瀏覽器資料會失去紀錄。</footer>
</main>
<script>
'use strict';
const KEY='guhealth-web-v2';
const tests=[
{id:'clock',name:'畫鐘測驗',group:'認知',intro:'依指示在畫布上畫出時鐘、1 到 12 的數字及 10 點 10 分的時針與分針，也可以在紙上完成後由家人協助紀錄。',safe:'請勿把本測驗視為失智症診斷。視力、慣用手、教育背景及語言可能影響表現。',steps:[{type:'clock',prompt:'畫出完整的鐘面，寫上 1 到 12，並畫出 10 點 10 分。完成後請照顧者觀察。'},{type:'choice',prompt:'鐘面、12 個數字與兩支指針是否都能清楚辨識？',options:['是','否','不確定']},{type:'choice',prompt:'數字排列及指針指向 10 點 10 分是否大致正確？',options:['是','否','不確定']}],advice:'若畫鐘困難或近期記憶、日常功能明顯改變，請安排家醫科、神經內科或記憶門診評估。正常畫鐘也不能排除認知問題。'},
{id:'fast',name:'FAST 中風徵象',group:'緊急辨識',intro:'觀察突然發生的臉部不對稱、單側手臂無力或說話困難。這不是排除中風的檢查。',safe:'若任何症狀突然出現，立刻撥打 119；不必完成所有步驟。突然視力障礙、劇烈頭痛、走路不穩也需要緊急評估。',steps:[{type:'choice',prompt:'F：微笑時是否有突然出現的單側嘴角下垂？',options:['沒有','有','不確定']},{type:'choice',prompt:'A：雙臂向前平舉約 10 秒，是否有突然出現的單側無力或下垂？',options:['沒有','有','不確定']},{type:'choice',prompt:'S：說一句日常短句，是否突然口齒不清、語言理解困難或說不出話？',options:['沒有','有','不確定']},{type:'text',prompt:'T：記錄最後一次確認正常的時間（選填，例：今天 14:20）。'}],advice:'若症狀突然出現，即使自行恢復，也請立即求救，可能是暫時性腦缺血發作或中風。'},
{id:'calf',name:'小腿手指圈觀察',group:'肌肉',intro:'坐著，以雙手拇指和食指圍住非慣用腳小腿最粗的位置，觀察指尖是否交疊。',safe:'此方法受手指大小、體型、水腫影響，僅是肌少症風險線索，不可單獨判定肌肉量正常或嚴重流失。',steps:[{type:'choice',prompt:'環繞小腿最粗處時，手指的狀態？',options:['指尖碰不到（圈不住）','剛好碰到','指尖交疊（小腿相對細）','無法測量']}],advice:'若指尖交疊、體重下降、步速變慢或肌力下降，可向醫師或物理治療師詢問肌少症評估。'},
{id:'chair',name:'五次坐站測驗',group:'肌力',intro:'使用穩固、靠牆、不滑動的椅子，腳平放地面。視能力將雙手交叉胸前，連續完整站起坐下 5 次，記錄秒數。',safe:'有近期跌倒、暈眩、胸痛、嚴重關節疼痛、無法安全站起者不要測；請人陪同，必要時扶持，不能安全完成請停止。',steps:[{type:'timer',prompt:'準備好後開始計時，完成第五次站起時停止。',max:120},{type:'choice',prompt:'過程是否能在安全情況下完成？',options:['完成且未使用手扶','完成但需要扶持或改變動作','無法完成／中途停止']}],advice:'較慢或需要扶持可能提示下肢功能問題，但 12 秒或 15 秒不是適用所有年齡與測法的診斷界線。請結合其他評估。'},
{id:'balance',name:'單腳站立觀察',group:'平衡',intro:'在平穩地面、穩固扶手旁，由家人陪同。眼睛保持張開，嘗試單腳站立，最多 30 秒。',safe:'請不要閉眼測試。易跌倒、近期暈眩、無法站穩者直接跳過；不要勉強，也不能用本測驗診斷微型中風或小腦退化。',steps:[{type:'timer',prompt:'扶手隨時可抓，離地腳落地或需要支撐時停止計時。',max:30},{type:'choice',prompt:'測驗是否安全完成？',options:['自行完成','曾需扶持','不安全／無法進行']}],advice:'若平衡能力下降或曾跌倒，請安排跌倒風險評估；若突然失去平衡、合併其他神經症狀，立即撥打 119。'},
{id:'phalen',name:'法倫氏手腕測驗',group:'周邊神經',intro:'讓雙手手背輕輕相貼並彎曲手腕，觀察是否誘發拇指、食指、中指和部分無名指的麻刺感。',safe:'不要強迫彎到 90 度。若手腕疼痛、受傷或已有明顯症狀，勿繼續施力；陽性不等於確診腕隧道症候群。',steps:[{type:'timer',prompt:'舒適姿勢維持最多 60 秒；出現不舒服立即停止。',max:60},{type:'choice',prompt:'是否出現典型手指麻、刺痛？',options:['沒有','有','不確定／其他位置']}],advice:'若反覆手麻、夜間惡化或手指無力，請向復健科、神經內科或手外科評估。'},
{id:'slr',name:'直抬腿症狀紀錄',group:'神經壓迫',intro:'此為症狀觀察輔助：平躺時由專業人員評估抬腿引發的放射痛，居家請勿強行抬腿。',safe:'不要請他人強拉腿部。若新發生大小便控制異常、會陰麻木、雙腿進行性無力，請立即急診。',steps:[{type:'choice',prompt:'平時或已由醫療人員檢查時，是否有從臀部延伸到膝下／足部的放射痛或麻木？',options:['沒有','有','不確定／未檢查']},{type:'choice',prompt:'是否有進行性腿無力、會陰麻木或新發生大小便異常？',options:['沒有','有','不確定']}],advice:'放射性疼痛可能與神經根刺激有關，但不能只靠抬腿角度確診椎間盤突出；請安排臨床神經學檢查。'},
{id:'crt',name:'指甲回血觀察',group:'末梢循環',intro:'在溫暖、光線充足的環境，輕壓手指甲床約 5 秒至變白，放開後計算恢復原色所需時間。',safe:'冰冷環境、年齡、光線、指甲油均影響結果。不能單獨用於診斷休克、脫水或動脈阻塞；若意識不清、呼吸困難、皮膚冰冷合併不適，立即求救。',steps:[{type:'timer',prompt:'放開指甲後開始計時，回復原色時停止。',max:15},{type:'choice',prompt:'是否有明顯變色、疼痛或手指冰冷？',options:['沒有','有','不確定']}],advice:'回血較慢可以有多種原因；若持續異常、手指疼痛或顏色改變，請就醫評估。'}
];
const $=id=>document.getElementById(id);
let current=null,step=0,answers=[],timerStart=0,elapsed=0,timerInterval=null,drawing=[];
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function showCatalog(){stopTimer();$('next').hidden=false;$('prev').hidden=false;current=null;$('catalog').hidden=false;$('test').hidden=true;$('result').hidden=true;window.scrollTo(0,0)}
tests.forEach(t=>{const article=document.createElement('article');article.className='card';const h=document.createElement('h2');h.textContent=t.name;const p=document.createElement('p');p.textContent=t.group+'｜'+t.intro;const b=document.createElement('button');b.textContent='開始觀察';b.addEventListener('click',()=>start(t));article.append(h,p,b);$('catalog').append(article)});
function start(t){stopTimer();$('next').hidden=false;$('prev').hidden=false;current=t;step=0;answers=[];drawing=[];$('catalog').hidden=true;$('result').hidden=true;$('test').hidden=false;$('testTitle').textContent=t.name;$('intro').textContent=t.intro;$('safety').textContent=t.safe;renderStep()}
function renderStep(){stopTimer();const s=current.steps[step];$('progress').textContent='第 '+(step+1)+' / '+current.steps.length+' 步';$('task').replaceChildren();const title=document.createElement('h3');title.textContent=s.prompt;$('task').append(title);$('prev').disabled=step===0;$('next').textContent=step===current.steps.length-1?'查看結果':'下一步';$('next').disabled=false;
if(s.type==='choice'){const options=document.createElement('div');options.className='choices';s.options.forEach((value,i)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='answer';input.value=value;input.checked=answers[step]===value;input.addEventListener('change',()=>{answers[step]=value;if(current.id==='fast'&&(value==='有'||value==='不確定'))showEmergency()});label.append(input,document.createTextNode(value));options.append(label)});$('task').append(options)}
if(s.type==='text'){const input=document.createElement('input');input.type='text';input.maxLength=100;input.placeholder='可略過';input.value=answers[step]||'';input.addEventListener('input',()=>answers[step]=input.value);$('task').append(input)}
if(s.type==='timer'){const clock=document.createElement('div');clock.id='timerDisplay';clock.setAttribute('role','timer');clock.textContent=typeof answers[step]==='number'?answers[step].toFixed(1)+' 秒':'0.0 秒';const startB=document.createElement('button');startB.type='button';startB.textContent='開始';const stopB=document.createElement('button');stopB.className='secondary';stopB.type='button';stopB.textContent='停止';stopB.disabled=true;startB.onclick=()=>{stopTimer();timerStart=performance.now();startB.disabled=true;stopB.disabled=false;timerInterval=setInterval(()=>{elapsed=Math.min(s.max,(performance.now()-timerStart)/1000);clock.textContent=elapsed.toFixed(1)+' 秒';if(elapsed>=s.max)stopB.click()},80)};stopB.onclick=()=>{if(!timerInterval)return;elapsed=Math.min(s.max,(performance.now()-timerStart)/1000);answers[step]=Math.round(elapsed*10)/10;clock.textContent=answers[step].toFixed(1)+' 秒';stopTimer();startB.disabled=false;stopB.disabled=true};const controls=document.createElement('div');controls.className='actions';controls.append(startB,stopB);$('task').append(clock,controls);const manual=document.createElement('label');manual.textContent='或手動輸入秒數（非必填）';const input=document.createElement('input');input.type='number';input.min=0;input.max=s.max;input.step='.1';input.value=typeof answers[step]==='number'?answers[step]:'';input.addEventListener('change',()=>{const n=Number(input.value);if(input.value!==''&&Number.isFinite(n)&&n>=0&&n<=s.max){answers[step]=n;clock.textContent=n.toFixed(1)+' 秒'}});manual.append(input);$('task').append(manual)}
if(s.type==='clock'){const canvas=document.createElement('canvas');canvas.id='draw';canvas.width=600;canvas.height=600;canvas.setAttribute('aria-label','可使用滑鼠或手指畫鐘的白色畫布');const ctx=canvas.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#173d34';const redraw=()=>{ctx.clearRect(0,0,600,600);drawing.forEach(line=>{ctx.beginPath();line.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]));ctx.stroke()})};redraw();let active=false;const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};canvas.onpointerdown=e=>{active=true;canvas.setPointerCapture(e.pointerId);drawing.push([point(e)]);redraw()};canvas.onpointermove=e=>{if(!active)return;drawing[drawing.length-1].push(point(e));redraw()};canvas.onpointerup=canvas.onpointercancel=()=>{active=false};const clear=document.createElement('button');clear.className='secondary';clear.textContent='清除重畫';clear.onclick=()=>{drawing=[];redraw()};$('task').append(canvas,clear);const note=document.createElement('p');note.textContent='不會自動用 AI 評分或上傳畫面；儲存時只記錄後續主觀觀察，不保存圖像。';$('task').append(note)}
}
function showEmergency(){stopTimer();$('task').replaceChildren();const div=document.createElement('div');div.className='urgent';div.innerHTML='<h3>疑似急性中風：請立即撥打 119</h3><p>記下最後正常時間，不要自行駕車；即使症狀消失也須緊急就醫。</p><a class="button" href="tel:119">立即撥打 119</a>';const back=document.createElement('button');back.className='secondary';back.textContent='返回測驗列表';back.onclick=showCatalog;$('task').append(div,back);$('next').hidden=true;$('prev').hidden=true}
function finish(){stopTimer();$('next').hidden=false;$('prev').hidden=false;$('test').hidden=true;$('result').hidden=false;const details=current.steps.map((s,i)=>s.prompt+'\n'+(answers[i]===undefined?'未填／未測':typeof answers[i]==='number'?answers[i]+' 秒':answers[i])).join('\n\n');$('resultText').textContent=details;let advice=current.advice;let flag=false;
if(current.id==='fast'){flag=answers.slice(0,3).some(v=>v!=='沒有');if(flag)advice='疑似中風或資料不確定時，若為突然發生的症狀，請立即撥打 119。'+advice}
if(current.id==='clock')flag=answers.slice(1).some(v=>v!=='是');
if(current.id==='calf')flag=answers.includes('指尖交疊（小腿相對細）');
if(current.id==='chair')flag=(typeof answers[0]==='number'&&answers[0]>12)||answers[1]!=='完成且未使用手扶';
if(current.id==='balance')flag=(typeof answers[0]==='number'&&answers[0]<10)||answers[1]!=='自行完成';
if(current.id==='phalen')flag=answers[1]==='有';
if(current.id==='slr')flag=answers.includes('有');
if(current.id==='crt')flag=(typeof answers[0]==='number'&&answers[0]>3)||answers[1]==='有';
if(answers.every(v=>v===undefined))flag=false;
$('resultAdvice').textContent=advice+'\n本結果僅供自我觀察，不提供診斷。';$('status').textContent='';$('save').disabled=false;$('save').onclick=()=>saveRecord(details,flag)}
function saveRecord(details,flag){try{const data=JSON.parse(localStorage.getItem(KEY));if(!data||!data.profile||!Array.isArray(data.records)){throw new Error('請先回顧健康首頁建立健康檔案，再儲存紀錄。')}const date=new Date().toLocaleDateString('sv-SE');data.records.push({id:typeof crypto.randomUUID==='function'?crypto.randomUUID():String(Date.now()),kind:'selfcheck',key:current.id,title:current.name,date,note:details+'\n主觀居家觀察，非診斷。',flag});data.demo=false;localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='已儲存到我的紀錄，可返回主站查看。';$('save').disabled=true}catch(e){$('status').textContent='儲存失敗：'+e.message}}
$('back').onclick=showCatalog;$('again').onclick=showCatalog;$('prev').onclick=()=>{if(step>0){step--;renderStep()}};$('next').onclick=()=>{const s=current.steps[step];if(s.type==='choice'&&!answers[step]){alert('請先選擇一個答案。');return}if(s.type==='timer'&&timerInterval){alert('請先停止計時。');return}if(current.id==='fast'&&step<3&&answers[step]!=='沒有'){showEmergency();return}if(step<current.steps.length-1){step++;renderStep()}else finish()};
</script>
</body></html>
