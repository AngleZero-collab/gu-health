name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, same pin as repository history checks
        with:
          persist-credentials: false
      - name: Check generated Xcode project
        run: |
          python3 ios/scripts/generate-project.py
          git diff --exit-code -- ios/GuHealth.xcodeproj
      - name: Test core policies, reports, storage and Android backup compatibility
        run: swift test --package-path ios
      - name: Build for iPhone without signing
        run: xcodebuild -project ios/GuHealth.xcodeproj -scheme GuHealth -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Test native screens on an available iPhone simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable") and "iPhone" in d["name"]]; assert devices,"No available iPhone simulator"; print(devices[0]["udid"])')
          xcodebuild -project ios/GuHealth.xcodeproj -scheme GuHealth -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/simulator -resultBundlePath build/GuHealth-UI.xcresult CODE_SIGNING_ALLOWED=NO test
